<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ソフトボール道場</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d1117;color:#fff;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px);position:relative}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}
h1{margin:6px 0 2px;font-size:30px;text-align:center;letter-spacing:2px;background:linear-gradient(90deg,#ffd54f,#ff7043);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:#9aa4b2;font-size:13px;margin-bottom:10px}
.hero{display:flex;justify-content:center;margin:4px 0 10px}
.face{width:96px;height:96px;border-radius:50%;border:4px solid #ffd54f;background:#1f2937;display:flex;align-items:center;justify-content:center;font-size:46px;overflow:hidden;flex:none}
.face img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.levels{display:flex;flex-direction:column;gap:8px;overflow:auto;padding-bottom:6px}
.lv{display:flex;align-items:center;gap:12px;border:0;border-radius:14px;padding:12px 14px;color:#fff;text-align:left;font-size:16px;cursor:pointer;background:#161b22;border-left:8px solid var(--c);box-shadow:0 2px 0 #000}
.lv:active{transform:translateY(2px);box-shadow:none}
.lv b{font-size:20px;min-width:52px;color:var(--c)}
.lv span{flex:1;font-size:14px}
.lv small{color:#9aa4b2;font-size:11px;white-space:nowrap}
.hud{display:flex;align-items:center;gap:8px;font-weight:700}
.hud button{background:#222a35;border:0;color:#fff;border-radius:10px;padding:8px 10px;font-size:14px}
.hud .lvl{font-size:13px;color:#ffd54f}
.hud .sc{margin-left:auto;font-size:22px;font-variant-numeric:tabular-nums}
.combo{height:24px;margin:4px 0;display:flex;align-items:center;gap:8px}
.cbar{flex:1;height:8px;background:#222a35;border-radius:4px;overflow:hidden}
.cbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd54f,#ff5252);transition:width .25s}
.ctext{font-size:15px;font-weight:800;color:#ffd54f;min-width:96px;text-align:right}
.coach{display:flex;gap:10px;align-items:center;margin:2px 0 6px}
.coach .face{width:58px;height:58px;font-size:28px;border-width:3px}
.bubble{flex:1;background:#1f2937;border-radius:14px;padding:8px 12px;font-size:13px;line-height:1.45;min-height:50px;display:flex;align-items:center;position:relative}
.bubble:before{content:"";position:absolute;left:-8px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:#1f2937;border-left:0}
.field{flex:1;min-height:0;width:100%;border-radius:14px;background:#0f2a12}
.q{font-size:18px;font-weight:800;line-height:1.4;margin:8px 2px;text-align:center}
.choices{display:flex;flex-direction:column;gap:8px}
.c{border:0;border-radius:14px;padding:14px 10px;font-size:16px;font-weight:700;color:#fff;background:#2b3545;box-shadow:0 3px 0 #11161d;min-height:52px}
.c:active{transform:translateY(3px);box-shadow:none}
.c.right{background:#2e9e4f;box-shadow:0 3px 0 #1b6a33}
.c.wrong{background:#c0392b;box-shadow:0 3px 0 #7d241b}
.c[disabled]{pointer-events:none}
.pop{position:absolute;pointer-events:none;font-size:26px;font-weight:900;color:#ffd54f;text-shadow:0 2px 0 #000;animation:pop .9s ease-out forwards;z-index:10}
@keyframes pop{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1;transform:translateY(-10px) scale(1.2)}100%{transform:translateY(-80px) scale(1);opacity:0}}
.flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:5}
.flash.g{background:radial-gradient(circle,rgba(76,217,100,.35),transparent 70%);animation:fl .4s}
.flash.r{background:radial-gradient(circle,rgba(255,69,58,.35),transparent 70%);animation:fl .4s}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
.bounce{animation:bn .45s}
@keyframes bn{0%,100%{transform:scale(1)}40%{transform:scale(1.25) rotate(-6deg)}70%{transform:scale(.95) rotate(4deg)}}
.shake{animation:sk .4s}
@keyframes sk{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.stat{display:flex;justify-content:space-between;color:#9aa4b2;font-size:12px;margin-top:6px}
.mute{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 8px);background:#222a35;border:0;color:#fff;border-radius:10px;padding:6px 10px;font-size:16px}
@keyframes pulse{0%,100%{r:11}50%{r:14}}
.hl{animation:pulse .8s infinite}
</style>
</head>
<body>
<div id="app">
  <div class="flash" id="flash"></div>

  <section class="screen on" id="title">
    <button class="mute" id="muteT">🔊</button>
    <h1>ソフトボール道場</h1>
    <div class="sub">レベルを選んでスタート。終わりはない。やめたいときにやめろ。</div>
    <div class="hero"><div class="face" id="heroFace"></div></div>
    <div class="levels" id="levels"></div>
  </section>

  <section class="screen" id="game">
    <div class="hud">
      <button id="back">← もどる</button>
      <span class="lvl" id="lvlName"></span>
      <span class="sc" id="score">0</span>
    </div>
    <div class="combo"><div class="cbar"><i id="cfill"></i></div><div class="ctext" id="ctext"></div></div>
    <div class="coach">
      <div class="face" id="coachFace"></div>
      <div class="bubble" id="bubble">さあ、いくぞ！</div>
    </div>
    <div id="fieldWrap" style="flex:1;min-height:0;display:flex"></div>
    <div class="q" id="qtext"></div>
    <div class="choices" id="choices"></div>
    <div class="stat"><span id="stat1"></span><span id="stat2"></span></div>
  </section>
</div>

// ===== ユーティリティ =====
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

// ===== 音 =====
let ac=null,mute=false;
function beep(f,d,t,v){if(mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||.15;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
const sOK=n=>{beep(600+Math.min(n,12)*40,.12);setTimeout(()=>beep(900+Math.min(n,12)*50,.18),90)};
const sNG=()=>beep(180,.3,'sawtooth',.1);
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

// ===== フィールド描画 =====
const BASE={0:[120,190],1:[175,135],2:[120,80],3:[65,135]};
const POS={P:[120,142,'投'],C:[120,206,'捕'],F:[190,140,'一'],S:[150,98,'二'],T:[50,140,'三'],SS:[90,98,'遊'],L:[48,44,'左'],Cn:[120,24,'中'],R:[192,44,'右']};
function fieldSVG(o){
  o=o||{};
  let s='<svg class="field" viewBox="0 0 240 215" preserveAspectRatio="xMidYMid meet">';
  s+='<rect width="240" height="215" rx="14" fill="#2e7d32"/>';
  s+='<polygon points="120,196 183,133 120,70 57,133" fill="#c68a4b"/>';
  s+='<polygon points="120,190 175,135 120,80 65,135" fill="#3a8f3d"/>';
  s+='<polyline points="120,190 240,70" stroke="#fff" stroke-width="1.5" fill="none" opacity=".7"/>';
  s+='<polyline points="120,190 0,70" stroke="#fff" stroke-width="1.5" fill="none" opacity=".7"/>';
  [1,2,3,0].forEach(k=>{const[x,y]=BASE[k];s+=`<rect x="${x-6}" y="${y-6}" width="12" height="12" fill="#fff" transform="rotate(45 ${x} ${y})"/>`});
  if(o.f){Object.keys(POS).forEach(k=>{const[x,y,t]=POS[k];const q=o.hl===k,h=q||o.me===k;
    s+=`<circle cx="${x}" cy="${y}" r="${h?11:8}" fill="${h?'#ff5252':'#1565c0'}" stroke="#fff" stroke-width="${h?2.5:1}" ${h?'class="hl"':''}/>`;
    s+=`<text x="${x}" y="${y+3.5}" fill="#fff" font-size="${h?10:9}" font-weight="700" text-anchor="middle">${q?'？':t}</text>`})}
  (o.r||[]).forEach(k=>{const[x,y]=BASE[k];s+=`<circle cx="${x}" cy="${y-2}" r="9" fill="#ffeb3b" stroke="#000" stroke-width="2"/><text x="${x}" y="${y+1.5}" font-size="9" font-weight="900" text-anchor="middle">走</text>`});
  if(typeof o.o==='number'||o.r){const n=o.o||0;s+='<text x="8" y="16" fill="#fff" font-size="11" font-weight="700">OUT</text>';for(let i=0;i<2;i++)s+=`<circle cx="${40+i*14}" cy="12" r="5" fill="${i<n?'#ff5252':'none'}" stroke="#fff" stroke-width="1.5"/>`}
  return s+'</svg>';
}

// ===== ゲーム状態 =====
let lv=0,score=0,combo=0,maxCombo=0,right=0,total=0,bag=[],last=null,cur=null,t0=0,locked=false,timer=null;

function pool(l){return l===0?[].concat(...Object.keys(LV).map(k=>LV[k].q.map(q=>[q,+k]))):LV[l].q.map(q=>[q,l])}
function nextItem(){
  if(!bag.length){bag=shuffle(pool(lv));if(last&&bag.length>1&&bag[bag.length-1][0]===last)bag.unshift(bag.pop())}
  const it=bag.pop();last=it[0];return it;
}

function say(t){$('#bubble').textContent=t}
function pop(txt){const el=document.createElement('div');el.className='pop';el.textContent=txt;el.style.left=(30+Math.random()*40)+'%';el.style.top='45%';$('#app').appendChild(el);setTimeout(()=>el.remove(),900)}
function flash(c){const f=$('#flash');f.className='flash';void f.offsetWidth;f.className='flash '+c}
function anim(el,c){el.classList.remove('bounce','shake');void el.offsetWidth;el.classList.add(c)}

function updateHUD(){
  $('#score').textContent=score;
  const w=Math.min(combo,20)/20*100;$('#cfill').style.width=w+'%';
  let r='';if(combo>=30)r='🔥伝説！';else if(combo>=20)r='🔥超一流';else if(combo>=10)r='⚡一流';else if(combo>=5)r='✨好調';else if(combo>=2)r=combo+'連続';
  $('#ctext').textContent=r;
  $('#stat1').textContent='正解 '+right+' / '+total;
  $('#stat2').textContent='最大コンボ '+maxCombo;
}

function render(){
  const [q,qlv]=nextItem();cur=q;locked=false;
  const opt=q[4]||{};
  $('#fieldWrap').innerHTML=fieldSVG(opt);
  $('#qtext').textContent=q[0];
  const idx=shuffle(q[1].map((_,i)=>i));
  const box=$('#choices');box.innerHTML='';
  idx.forEach(i=>{const b=document.createElement('button');b.className='c';b.textContent=q[1][i];b.dataset.i=i;b.onclick=()=>choose(b,i);box.appendChild(b)});
  if(lv===0)$('#lvlName').textContent='MIX Lv'+qlv;
  t0=Date.now();
}

function choose(btn,i){
  if(locked)return;locked=true;total++;
  const ok=i===cur[2];
  const sec=(Date.now()-t0)/1000;
  document.querySelectorAll('.c').forEach(b=>{b.disabled=true;if(+b.dataset.i===cur[2])b.classList.add('right')});
  if(ok){
    right++;combo++;maxCombo=Math.max(maxCombo,combo);
    const bonus=sec<3?50:0;const gain=100+Math.min(combo,30)*10+bonus;
    score+=gain;
    pop('+'+gain);flash('g');sOK(combo);vib(20);anim($('#coachFace'),'bounce');
    const msgs=['ナイス！','その調子！','いいぞ！','完璧！','さすが！'];
    say((combo>=10?'止まらないな！':msgs[combo%msgs.length])+(bonus?' はやい！':''));
    updateHUD();
    timer=setTimeout(render,650);
  }else{
    combo=0;btn.classList.add('wrong');
    sNG();vib([40,30,40]);flash('r');anim($('#coachFace'),'shake');anim($('#fieldWrap'),'shake');
    say('惜しい！ '+cur[3]);
    updateHUD();
    const b=$('#choices');const nb=document.createElement('button');nb.className='c';nb.style.background='#3b4a63';nb.textContent='次へ ▶';nb.disabled=false;nb.onclick=()=>{clearTimeout(timer);render()};b.appendChild(nb);
    timer=setTimeout(render,3200);
  }
}

function start(l){
  lv=l;score=0;combo=0;maxCombo=0;right=0;total=0;bag=[];last=null;
  $('#lvlName').textContent=l===0?'MIX':'Lv'+l+' '+LV[l].name;
  $('#title').classList.remove('on');$('#game').classList.add('on');
  say('さあ、いくぞ！');updateHUD();render();
}
function quit(){
  clearTimeout(timer);
  const k='sd_best_'+lv;const b=+(store(k)||0);if(score>b)store(k,String(score));
  $('#game').classList.remove('on');$('#title').classList.add('on');buildLevels();
}

function buildLevels(){
  const w=$('#levels');w.innerHTML='';
  Object.keys(LV).forEach(k=>{
    const best=store('sd_best_'+k)||0;
    const b=document.createElement('button');b.className='lv';b.style.setProperty('--c',LV[k].color);
    b.innerHTML=`<b>Lv${k}</b><span>${LV[k].name}</span><small>BEST ${best}</small>`;
    b.onclick=()=>start(+k);w.appendChild(b);
  });
  const m=document.createElement('button');m.className='lv';m.style.setProperty('--c','#ffd54f');
  m.innerHTML=`<b>MIX</b><span>全レベルまぜまぜ</span><small>BEST ${store('sd_best_0')||0}</small>`;
  m.onclick=()=>start(0);w.appendChild(m);
}

function toggleMute(){mute=!mute;document.querySelectorAll('.mute').forEach(b=>b.textContent=mute?'🔇':'🔊')}

$('#heroFace').innerHTML=faceHTML();
$('#coachFace').innerHTML=faceHTML();
$('#back').onclick=quit;
$('#muteT').onclick=toggleMute;
buildLevels();
</script>
</body>
</html>
